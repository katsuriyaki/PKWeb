# PHP Security Hardening Configuration
# Add these to php.ini or create as /etc/php/*/cli/conf.d/99-hardening.ini

# File Upload Restrictions
upload_max_filesize = 2M
post_max_size = 2M

# Prevent directory traversal and access outside web root
open_basedir = /var/www/html/PKWeb:/tmp

# Disable dangerous functions
disable_functions = exec,system,shell_exec,passthru,proc_open,popen,curl_exec,wget,curl_multi_exec,parse_ini_file,show_source

# Hide PHP version from headers
expose_php = Off

# Error handling - don't display errors in production
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

# Prevent remote file inclusions
allow_url_fopen = Off
allow_url_include = Off

# Session security
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.cookie_samesite = Strict

# Prevent SQL injection via magic quotes (deprecated but extra layer)
magic_quotes_gpc = Off

# Disable remote file access in XML
libxml_disable_entity_loader = On

# Limit execution time
max_execution_time = 30
max_input_time = 30

# Memory limit for uploads
memory_limit = 128M

# Prevent sessions fixation
session.use_only_cookies = 1
session_regenerate_id = 1