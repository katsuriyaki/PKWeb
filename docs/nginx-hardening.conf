# Nginx Security Hardening Configuration
# Add to server block in /etc/nginx/sites-available/PKWeb

# Hide nginx version
server_tokens off;

# Disable directory listing
autoindex off;

# Security Headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Limit body size (2MB for uploads)
client_max_body_size 2m;

# Deny access to sensitive files
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

location ~ /\.env {
    deny all;
}

location ~ /\.git {
    deny all;
}

location ~ config\.php$ {
    deny all;
}

# Block PHP execution in uploads directory
location /uploads/ {
    location ~ \.php$ {
        deny all;
    }
    # Allow only image files
    location ~ \.(jpg|jpeg|png|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    # Deny all other files
    deny all;
}

# Block access to backup directories
location ~ /backup {
    deny all;
}

# Block SQL injection attempts
location ~ *(\.sql|\.bak|\.old|\.backup) {
    deny all;
}

# Block common exploit patterns
if ($request_uri ~* "(eval|base64_decode|curl_exec)") {
    return 403;
}

# Disable unused methods
if ($request_method !~ ^(GET|POST|HEAD)$) {
    return 405;
}

# Prevent clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;